  <section class="demo">
    <span class="badge">JavaScript Basics</span>
    <h2>Create a form validation program</h2>
    <form id='form'><label>Name</label><input id='name' required pattern='[A-Za-z ]{2,}'><label>Email</label><input id='email' type='email' required><label>Password</label><input id='pass' type='password' minlength='6' required><button class='btn'>Validate</button></form><div id='out' class='result'></div>
  </section>
</main>
<footer>HTML · CSS · JavaScript Practical Programs · P. Gowtham · Section 6 · PRN 250200209</footer>
<script>
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('out').textContent=e.target.checkValidity()?'Valid form.':'Please correct the fields.';e.target.reportValidity()})
</script>
</body>
