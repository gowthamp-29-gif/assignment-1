  <section class="demo">
    <span class="badge">Browser &amp; Storage</span>
    <h2>Create a stopwatch</h2>
    <div id='sw' class='kpi'>0.0 s</div><button class='btn' onclick='startSW()'>Start</button> <button class='btn light' onclick='stopSW()'>Stop</button> <button class='btn green' onclick='resetSW()'>Reset</button>
  </section>
</main>
<footer>HTML · CSS · JavaScript Practical Programs · P. Gowtham · Section 6 · PRN 250200209</footer>
<script>
let st=null,start=0;function startSW(){if(st)return;start=Date.now()-(window.elapsed||0);st=setInterval(()=>{window.elapsed=Date.now()-start;document.getElementById('sw').textContent=(window.elapsed/1000).toFixed(1)+' s'},100)}function stopSW(){clearInterval(st);st=null}function resetSW(){stopSW();window.elapsed=0;document.getElementById('sw').textContent='0.0 s'}
</script>
</body>
