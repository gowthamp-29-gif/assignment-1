  <section class="demo">
    <span class="badge">Mini Projects</span>
    <h2>Create a digital calculator</h2>
    <input id='a' type='number' value='12'><select id='op'><option>+</option><option>-</option><option>*</option><option>/</option></select><input id='b' type='number' value='4'><button class='btn' onclick='runCalc()'>=</button><div id='out' class='result'>Result appears here.</div>
  </section>
</main>
<footer>HTML · CSS · JavaScript Practical Programs · P. Gowtham · Section 6 · PRN 250200209</footer>
<script>
function runCalc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value,o=document.getElementById('op').value;let r=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:b? a/b:'Undefined';document.getElementById('out').textContent='Result: '+r;}
</script>
</body>
